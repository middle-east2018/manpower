<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D5B8C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="عمالة ME">
<script>window.ME_API="https://script.google.com/macros/s/AKfycbxXYg6cvhmDWdT2aq4hz6Z52_QQF2BXmSJP5BKvwqHcN1Fr44-klQjGntC9A_sP0AGx/exec";</script>
</head><body>
<title>عمالة Middle East</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: تطبيق موبايل — شاشة دخول لوحدها، وبعدها شريط علوي ثابت (رجوع + عنوان) ومحتوى وتابات تحت.
   اللون الأساسي هو أزرق شيت الإكسيل بتاع الشركة. شيت الإكسيل نفسه أبيض دايماً زي الأصل. */
:root{
  --bg:#DDE3EA; --surface:#FFFFFF; --surface2:#F3F5F8; --ink:#16202B; --muted:#56636F; --line:#C9D2DC; --line2:#E4E8ED;
  --card-shadow:0 1px 2px rgba(16,32,52,.10),0 3px 10px rgba(16,32,52,.07);
  --accent:#2D5B8C; --accent-ink:#FFFFFF; --accent-soft:#E2EBF5;
  --ok:#1B7A47; --ok-soft:#DFF2E7; --warn:#8F5A00; --warn-soft:#FFF0D2; --bad:#B42318; --bad-soft:#FDE6E3; --fri:#FFF6E2;
  --shell:#2D5B8C; --shell-ink:#FFFFFF; --shell-sub:#C9DAEC;
  --f:"Readex Pro","Segoe UI",Tahoma,sans-serif;
  --bar:58px; --tabs:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090C11; --surface:#18222D; --surface2:#202B38; --ink:#E6EBF1; --muted:#9AA6B5; --line:#344353; --line2:#273340; --card-shadow:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.35);
  --accent:#86B2DE; --accent-ink:#0E1319; --accent-soft:#1C3047;
  --ok:#67C892; --ok-soft:#14301F; --warn:#EDBA5E; --warn-soft:#352812; --bad:#F2918A; --bad-soft:#3A1B18; --fri:#272111; --shell:#1A3350; --shell-ink:#EAF1F8; --shell-sub:#9FB6CE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090C11; --surface:#18222D; --surface2:#202B38; --ink:#E6EBF1; --muted:#9AA6B5; --line:#344353; --line2:#273340; --card-shadow:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.35);
  --accent:#86B2DE; --accent-ink:#0E1319; --accent-soft:#1C3047;
  --ok:#67C892; --ok-soft:#14301F; --warn:#EDBA5E; --warn-soft:#352812; --bad:#F2918A; --bad-soft:#3A1B18; --fri:#272111; --shell:#1A3350; --shell-ink:#EAF1F8; --shell-sub:#9FB6CE; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
input,select{scroll-margin-top:calc(var(--bar) + 20px);scroll-margin-bottom:calc(var(--tabs) + 100px)}
h1,h2,h3{text-wrap:balance}
bdi{unicode-bidi:isolate}
.en{direction:ltr;unicode-bidi:isolate}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--surface)}
.btn.small{padding:5px 12px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=password],input[type=date],input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.err{color:var(--bad);font-size:14px;margin:6px 0 0}
#dbBanner{margin:10px max(16px,env(safe-area-inset-left,0px)) 0;border-radius:10px;padding:10px 14px;font-size:14px}
#dbBanner.warn{background:var(--warn-soft);color:var(--warn)}
#dbBanner.bad{background:var(--bad-soft);color:var(--bad)}

/* شاشة الدخول */
.lock{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lock-in{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;letter-spacing:.5px;flex:none;font-family:"Segoe UI",Tahoma,sans-serif}
.mark.big{width:72px;height:72px;border-radius:18px;font-size:24px;margin-bottom:10px}
.lock h1{font-size:28px;margin:0;font-weight:700;line-height:1.25}
.lock-sub{margin:0 0 22px;color:var(--muted);font-size:15px}
.pin{width:100%;display:flex;flex-direction:column;gap:10px;text-align:right}
.pin label{font-weight:600}
.pin input{font-size:26px;letter-spacing:10px;text-align:center;padding:12px;border-radius:12px;width:100%}
.pin .btn{padding:13px;font-size:17px;border-radius:12px}

/* الشريط العلوي */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--shell);color:var(--shell-ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--shell)}
.appbar .iconbtn{color:var(--shell-ink)}
.appbar .iconbtn:hover{background:rgba(255,255,255,.12)}
.appbar #backBtn{background:rgba(255,255,255,.16);color:var(--shell-ink)}
.appbar .mark{background:rgba(255,255,255,.16);color:var(--shell-ink)}
.appbar .bar-title p{color:var(--shell-sub)}
.bar-in{max-width:1180px;margin:0 auto;min-height:var(--bar);display:flex;align-items:center;gap:6px;padding:6px max(10px,env(safe-area-inset-left,0px)) 6px max(10px,env(safe-area-inset-right,0px))}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none}
.iconbtn:hover{background:var(--surface2)}
#backBtn{background:var(--accent-soft);color:var(--accent)}
.bar-title{flex:1;min-width:0}
.bar-title h1{margin:0;font-size:18px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title p{margin:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-in .mark{width:36px;height:36px;border-radius:10px;font-size:13px}

/* المحتوى */
.page{max-width:760px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(var(--tabs) + 96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
body.wide .page{max-width:1180px}
.loading,.empty{color:var(--muted);padding:28px 16px;text-align:center;border:1px dashed var(--line);border-radius:14px;background:var(--surface)}
.hint{color:var(--muted);font-size:14px;margin:0}

/* تابات تحت */
.tabbar{position:fixed;inset:auto 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{flex:1;max-width:200px;height:var(--tabs);border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:13px;font-weight:500;position:relative}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;inset-inline:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.fab{position:fixed;z-index:19;inset-inline-start:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tabs) + 14px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:14px 20px;font-weight:600;font-size:16px;box-shadow:0 6px 18px rgba(20,40,70,.25);display:flex;align-items:center;gap:8px}

/* اختيار اليوم */
.daynav{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--card-shadow)}
.daynav .iconbtn{background:var(--surface2)}
.datepick{flex:1;position:relative;text-align:center;border-radius:12px;padding:6px 4px;cursor:pointer}
.datepick:hover{background:var(--surface2)}
.datepick b{display:block;font-size:20px;font-weight:600;line-height:1.3}
.datepick span{font-size:14px;color:var(--muted)}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.today-pill{display:inline-block;margin-inline-start:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 8px;font-size:12px;font-weight:600;vertical-align:middle}
.tally{display:flex;align-items:center;gap:12px}
/* كارت الحضور: خانة صغيرة لكل عامل بلون حالته */
.strip{flex:1;display:flex;gap:3px;min-width:0}
.strip i{flex:1;height:12px;border-radius:3px;background:var(--line2)}
.strip i.ok{background:var(--ok)}
.strip i.bad{background:var(--bad)}
.strip i.todo{background:var(--warn);opacity:.45}
.tally span{font-size:14px;color:var(--muted);white-space:nowrap}
.search{width:100%}

/* صف عامل في يوم */
.roster{display:flex;flex-direction:column;gap:10px}
.wrow{background:var(--surface);border:1px solid var(--line);box-shadow:var(--card-shadow);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.wrow.fri{background:var(--fri)}
.wtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.who{min-width:0}
.who b{display:block;font-size:17px;font-weight:600;line-height:1.3}
.who span{font-size:13px;color:var(--muted)}
.stat{flex:none;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:500;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.ok{background:var(--ok-soft);color:var(--ok)}
.stat.bad{background:var(--bad-soft);color:var(--bad)}
.stat.todo{background:var(--warn-soft);color:var(--warn)}
.stat.off{background:var(--surface2);color:var(--muted)}
.wtimes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > span{font-size:13px;color:var(--muted)}
.tm{display:flex;align-items:center;direction:ltr;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px 8px;height:48px}
.tm:focus-within{border-color:var(--accent);background:var(--surface)}
.tm.bad{border-color:var(--bad)}
.tm input{width:34px;border:0;background:transparent;text-align:center;padding:6px 0;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.tm input:focus{outline:none}
.tm input::placeholder{color:var(--muted);opacity:.55;font-weight:400}
.tm b{font-weight:600;color:var(--muted)}
.tm .ap{margin-left:auto;font-size:13px;color:var(--muted);direction:rtl}
.note{width:100%}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500}
.chip.go{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
/* اختيارات الملحوظة */
.npick{display:flex;flex-direction:column;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px;grid-column:1/-1}
.nseg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nseg button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px;font-weight:600}
.nseg button.pos{color:var(--ok)}
.nseg button.neg{color:var(--bad)}
.nseg button.pos[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.nseg button.neg[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.nopts{display:flex;flex-wrap:wrap;gap:8px}
.nopt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:14px;text-align:right;line-height:1.4}
.nopt.pos{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.nopt.neg{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.nopt:hover{background:var(--surface2)}
.nhint{font-size:13px;color:var(--muted)}

/* العمال */
.halfnav{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--card-shadow)}
.monthrow{display:flex;align-items:center;gap:8px}
.monthrow b{flex:1;text-align:center;font-size:18px;font-weight:600}
.monthrow .iconbtn{background:var(--surface2)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:500;color:var(--muted);line-height:1.3}
.seg button small{display:block;font-size:12px;font-weight:400}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--card-shadow)}
.prow{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-bottom:1px solid var(--line2);background:transparent;text-align:right}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--surface2)}
.prow .who{flex:1}
.prow .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.prow .who > span{display:block}
.prow .chev{color:var(--muted);flex:none}
.tag{border-radius:999px;padding:1px 9px;font-size:12px;background:var(--surface2);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.todo{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}

/* صفحة عامل */
.phead{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;box-shadow:var(--card-shadow)}
.phead .who b{font-size:20px}
.days{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--card-shadow)}
.dr{display:grid;grid-template-columns:92px 1fr 1fr;grid-template-areas:"dl f t" "dl n s";gap:8px 10px;padding:12px;border-bottom:1px solid var(--line2);align-items:center}
.dr:last-child{border-bottom:0}
.dr.fri{background:var(--fri)}
.dr.today{box-shadow:inset 3px 0 0 var(--accent)}
.dr .dl{grid-area:dl;display:flex;flex-direction:column;line-height:1.3}
.dr .dl b{font-weight:600}
.dr .dl span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dr .tf{grid-area:f}.dr .tt{grid-area:t}.dr .note{grid-area:n}.dr .stat{grid-area:s;justify-self:start;max-width:100%}
.dr .tm{height:44px}
.dr .fld > span{font-size:12px}
.dr .tm input{font-size:18px}
@media (max-width:520px){
  .dr{grid-template-columns:1fr 1fr;grid-template-areas:"dl s" "f t" "n n"}
  .dr .dl{flex-direction:row;gap:8px;align-items:baseline}
  .dr .stat{justify-self:end}
}
.pfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px}

/* إضافة شخص */
.form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--card-shadow)}
.form .fld > span{font-size:14px;color:var(--ink);font-weight:500}
.form input[type=text],.form select,.form input[type=date]{width:100%;padding:12px}
.jobs{display:flex;flex-wrap:wrap;gap:8px}
.jobs label{position:relative}
.jobs input{position:absolute;opacity:0;inset:0}
.jobs span{display:block;border:1px solid var(--line);border-radius:999px;padding:8px 16px;background:var(--surface2);font-weight:500}
.jobs input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.jobs input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.form .actions{display:flex;gap:10px}
.form .actions .btn{flex:1;padding:13px}

/* المدير */
.glist{display:flex;flex-direction:column;gap:10px}
.gitem{text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--card-shadow)}
.gitem:hover{border-color:var(--accent)}
.gitem .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gitem b{font-weight:600;direction:ltr;text-align:right;unicode-bidi:plaintext}
.gitem .meta{color:var(--muted);font-size:14px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--surface2);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.dls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dl-btn{display:flex;align-items:center;gap:8px;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 10px;color:var(--accent);min-width:0}
.dl-btn span{display:flex;flex-direction:column;min-width:0;color:var(--ink);line-height:1.3}
.dl-btn:hover{border-color:var(--accent)}
.dl-btn b{font-weight:600;font-size:14px}
.dl-btn small{color:var(--muted);font-size:12px}
@media (max-width:420px){.dl-btn{flex-direction:column;align-items:flex-start;gap:2px}}
.alerts{border:1px solid var(--warn);border-radius:14px;background:var(--warn-soft);padding:12px 14px;color:var(--ink)}
.alerts h3{margin:0 0 6px;font-size:16px;color:var(--warn)}
.arow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.arow .nm{min-width:140px;font-weight:600}
.arow input[type=number]{width:110px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
details.pn{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 14px}
details.pn summary{cursor:pointer;font-weight:600}
.nlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.nlist button{all:unset;cursor:pointer;display:flex;gap:8px;flex-wrap:wrap;padding:6px;border-radius:8px;width:100%;box-sizing:border-box}
.nlist button:hover{background:var(--surface2)}
.nlist .d{color:var(--muted);font-size:13px;min-width:56px;font-variant-numeric:tabular-nums}
.nlist .t.red{color:var(--bad)}.nlist .t.green{color:var(--ok)}
.hols{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.xl{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;color:#000}
.fbar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid #d4d4d4;background:#f3f3f3;direction:ltr;flex-wrap:wrap}
.fbar .ref{width:62px;text-align:center;border:1px solid #c6c6c6;background:#fff;color:#000;padding:3px 4px;font:13px "Segoe UI",Tahoma,sans-serif;border-radius:2px}
.fbar .fx{font:italic 14px "Cambria",Georgia,serif;color:#666;padding:0 4px}

/* ===================== أدوات التواريخ ===================== */
const pad2 = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseYMD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const daysIn = (y, m) => new Date(y, m, 0).getDate();
const ymOf = s => s.slice(0, 7);
function addMonths(ym, k){ let [y,m] = ym.split("-").map(Number); m += k; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return `${y}-${pad2(m)}`; }
function addDays(d, k){ const x = new Date(d); x.setDate(x.getDate()+k); return x; }
const todayStr = () => ymd(new Date());
const serial = d => Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899, 11, 30)) / 86400000);
const fromSerial = n => { const t = new Date(Date.UTC(1899, 11, 30) + Math.floor(n) * 86400000); return new Date(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()); };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const xesc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");

/* ===================== حساب الساعات (قواعد الشركة) =====================
   - يوم عادي: الشغل الفعلي = (الانصراف - الحضور) ناقص الجزء اللي واقع في البريك (1 لـ 2 الضهر).
     أساسي = أقل من 8 والشغل الفعلي، والإضافي = اللي فوق الـ 8. (التأخير بيتخصم من الإضافي تلقائياً)
   - الخميس: 8 ساعات يوم كامل حتى لو مشي بدري، والإضافي = اللي بعد الساعة 5، والتأخير يتخصم من الإضافي الأول وبعدين من الأساسي.
   - الجمعة والأعياد: كل الساعات (ناقص البريك) في خانة الجمعة والأعياد. */
const toMin = s => { if(!s) return null; const [h,m] = s.split(":").map(Number); return h*60+m; };
const r2 = x => Math.round(x*100)/100;
function calcDay(dateStr, f, t, holiday){
  if(!f || !t) return null;
  const a = toMin(f), b = toMin(t);
  if(!(b > a)) return {err:"وقت الانصراف لازم يكون بعد الحضور"};
  const dow = parseYMD(dateStr).getDay();
  const brk = Math.max(0, Math.min(b, 14*60) - Math.max(a, 13*60));
  if(dow === 5 || holiday) return {fri: r2((b - a - brk)/60), hol: !!holiday && dow !== 5};
  if(dow === 4){
    const late = Math.max(0, a - 8*60)/60;
    let ot = Math.max(0, b - 17*60)/60, basic = 8;
    const d = Math.min(late, ot); ot -= d; basic -= (late - d);
    return {basic: r2(Math.max(0, basic)), ot: r2(ot)};
  }
  const worked = (b - a - brk)/60;
  return {basic: r2(Math.max(0, Math.min(8, worked))), ot: r2(Math.max(0, worked - 8))};
}
function calcText(c){
  if(!c) return "";
  if(c.err) return c.err;
  if(c.fri != null) return `${c.hol ? "عيد" : "جمعة"}: ${c.fri} ساعة`;
  return `${c.basic} أساسي` + (c.ot ? ` + ${c.ot} إضافي` : "");
}
/* الساعة: "من" دايماً الصبح. "إلى": 1-11 يعني بعد الضهر، 12 = الضهر، 13-24 زي ما هي */
function normFrom(h, m){ return `${pad2(h)}:${pad2(m)}`; }
function normTo(h, m){ let H = h; if(H >= 1 && H <= 11) H += 12; if(H === 0) H = 24; return `${pad2(H)}:${pad2(m)}`; }
function showFrom(s){ if(!s) return ["",""]; const [h,m] = s.split(":"); return [h, m]; }
function showTo(s){ if(!s) return ["",""]; let [h,m] = s.split(":").map(Number); if(h > 12) h -= 12; return [pad2(h), pad2(m)]; }

/* ===================== تخزين البيانات (db) =====================
   workers/{wid}: {name, job, order, addedAt, removedAt, hist:{type:{ym:v}, rate:{ym:v}, title:{ym:v}}}
   att/{wid}__{ym}: {wid, ym, days:{DD:{f,t,n}}}         ← اللي بيسجله العامل المسؤول
   ovr/{wid}__{ym}: {wid, ym, cells:{A1:"raw"}}           ← تعديلات المدير على الشيت (null = رجوع للأوتوماتيك)
   cfg/main: {holidays:{"YYYY-MM-DD":true}} */
const S = {
  level: 0, sec: null, workers: {}, att: {}, ovr: {}, cfg: {holidays:{}},
  loaded: {workers:false, att:false, ovr:false, cfg:false}, slow:false,
  rec: {group:null, open:new Set(), adding:false, q:"", confirm:null},
  mgr: {group:null, sheet:null, sel:"A1", editing:false},
  pending:false, readOnly:false
};
let DB = null, DL = null, MEM = false;

function makeMemDB(){
  const docs = new Map(), ls = new Set();
  const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
  const collOf = p => p.split("/").slice(0,-1).join("/");
  const snap = p => { const d = docs.get(p); return {id:p.split("/").pop(), exists:!!d, data:()=>clone(d), metadata:{fromCache:false, hasPendingWrites:false}}; };
  const fire = l => { const ds = [...docs.keys()].filter(k => collOf(k) === l.coll).sort().map(snap); l.cb({docs:ds, size:ds.length, empty:!ds.length, docChanges:()=>[], metadata:{fromCache:false, hasPendingWrites:false}}); };
  const emit = p => queueMicrotask(() => { for(const l of ls){ if(l.coll === collOf(p)) fire(l); else if(l.doc === p) l.cb(snap(p)); } });
  const merge = (a, b) => { for(const k in b){ const v = b[k]; if(v && typeof v === "object" && !Array.isArray(v) && a[k] && typeof a[k] === "object") merge(a[k], v); else a[k] = clone(v); } };
  const api = {
    doc(p){ return { path:p, id:p.split("/").pop(),
      get: async () => snap(p),
      set: async d => { docs.set(p, clone(d)); emit(p); },
      update: async d => { const c = docs.get(p); if(!c) throw {code:"invalid_argument", message:"missing"}; merge(c, d); emit(p); },
      delete: async () => { docs.delete(p); emit(p); },
      onSnapshot(cb){ const l = {doc:p, cb}; ls.add(l); queueMicrotask(() => cb(snap(p))); return () => ls.delete(l); } }; },
    collection(c){ return { path:c, doc: id => api.doc(c + "/" + id),
      onSnapshot(cb){ const l = {coll:c, cb}; ls.add(l); queueMicrotask(() => fire(l)); return () => ls.delete(l); } }; },
    _docs: docs
  };
  return api;
}

/* نسخة Google Apps Script: البيانات في Google Sheet، والمتصفح بيسأل عن الجديد كل 20 ثانية */
/* نسخة التطبيق (PWA): نفس الكلام بس بيكلم السيرفر بـ fetch على لينك الـ API */
function apiCall(url){
  return async (fn, ...a) => {
    const body = fn === "dbSync" ? {fn, since: a[0]} : {fn, ops: a[0]};
    let r;
    try{ r = await fetch(url, {method:"POST", body: JSON.stringify(body), redirect:"follow"}); }
    catch(e){ throw {code:"unavailable", message:"network"}; }
    if(!r.ok) throw {code:"unavailable", message:"http " + r.status};
    const j = await r.json().catch(() => null);
    if(!j) throw {code:"unavailable", message:"bad response"};
    if(!j.ok) throw {code: /bad|missing|large/.test(j.error || "") ? "invalid_argument" : "unavailable", message: j.error};
    return j.res;
  };
}
function makeGasDB(transport){
  let ver = null, docs = {}, first = true;
  const ls = new Set();
  const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
  const collOf = p => p.split("/").slice(0,-1).join("/");
  const snap = p => { const d = docs[p]; return {id:p.split("/").pop(), exists:!!d, data:()=>clone(d), metadata:{fromCache:false, hasPendingWrites:false}}; };
  const fire = l => {
    if(l.doc){ l.cb(snap(l.doc)); return; }
    const ds = Object.keys(docs).filter(k => collOf(k) === l.coll).sort().map(snap);
    l.cb({docs:ds, size:ds.length, empty:!ds.length, docChanges:()=>[], metadata:{fromCache:false, hasPendingWrites:false}});
  };
  const call = transport || ((fn, ...a) => new Promise((res, rej) => google.script.run.withSuccessHandler(res)
    .withFailureHandler(e => rej({code: /bad|missing|large/.test(String(e && e.message)) ? "invalid_argument" : "unavailable", message: String(e && e.message || e)}))[fn](...a)));
  const apply = r => { if(!r || r.same) return; ver = r.ver; docs = r.docs || {}; first = false; for(const l of ls) fire(l); };
  let syncing = false;
  async function sync(){ if(syncing) return; syncing = true; try{ apply(await call("dbSync", ver)); }catch(e){ console.warn(e); if(first) for(const l of ls) l.err && l.err(e); } finally{ syncing = false; } }
  const write = async ops => { apply(await call("dbWrite", ops)); };
  setInterval(() => { if(document.visibilityState === "visible") sync(); }, 20000);

    `<HeadingPairs><vt:vector size="2" baseType="variant"><vt:variant><vt:lpstr>Worksheets</vt:lpstr></vt:variant><vt:variant><vt:i4>${N}</vt:i4></vt:variant></vt:vector></HeadingPairs>` +
    `<TitlesOfParts><vt:vector size="${N}" baseType="lpstr">` + names.map(n => `<vt:lpstr>${xesc(n)}</vt:lpstr>`).join("") + "</vt:vector></TitlesOfParts><LinksUpToDate>false</LinksUpToDate><SharedDoc>false</SharedDoc><HyperlinksChanged>false</HyperlinksChanged><AppVersion>16.0300</AppVersion></Properties>");
  const CT = "application/vnd.openxmlformats-officedocument.";

function halfInfo(key){ // "YYYY-MM|1"
  const [ym, h] = key.split("|"), [y, m] = ym.split("-").map(Number), half = +h;
  const start = new Date(y, m-1, half === 1 ? 1 : 16), len = half === 1 ? 15 : daysIn(y, m) - 15;
  return {ym, y, m, half, start, len, end: addDays(start, len-1),
    label: `شهر ${AR_MONTHS[m-1]} ${half === 1 ? "النصف الأول" : "النصف التاني"}`,
    range: `${half === 1 ? 1 : 16} لـ ${half === 1 ? 15 : daysIn(y, m)} ${AR_MONTHS[m-1]}`};
}
const halfKeyOf = date => `${ymOf(date)}|${+date.slice(8) <= 15 ? 1 : 2}`;
function nextHalf(k){ const [ym, h] = k.split("|"); return h === "1" ? `${ym}|2` : `${addMonths(ym, 1)}|1`; }
function prevHalf(k){ const [ym, h] = k.split("|"); return h === "2" ? `${ym}|1` : `${addMonths(ym, -1)}|2`; }
function halfWorkers(hi){ return sortedWorkers().filter(([wid, w]) => inRange(w, wid, hi.start, hi.len)); }
const qMatch = w => { const q = S.q.trim().toLowerCase(); return !q || String(w.name).toLowerCase().includes(q); };
function longDate(date){ const d = parseYMD(date); return `${AR_DAYS[d.getDay()]} ${d.getDate()} ${AR_MONTHS[d.getMonth()]}`; }
function timeBox(idp, val, ap, label){
  return `<span class="tm" data-tm="${idp}"><input id="${idp}-h" class="hh" inputmode="numeric" maxlength="2" placeholder="--" aria-label="${label}: الساعة" value="${esc(val[0])}" autocomplete="off"><b>:</b><input id="${idp}-m" class="mm" inputmode="numeric" maxlength="2" placeholder="00" aria-label="${label}: الدقايق" value="${esc(val[1])}" autocomplete="off"><span class="ap">${ap}</span></span>`;
}
function statusOf(wid, date){
  const r = dayRec(wid, date) || {}, dow = parseYMD(date).getDay(), hol = isHoliday(date);
  if(r.f){
    const c = calcDay(date, r.f, r.t, hol);
    if(c.err) return {cls:"bad", t:c.err};
    if(c.fri != null) return {cls:"ok", t:`${hol ? "عيد" : "جمعة"}: ${c.fri} ساعة`};
    return {cls:"ok", t: c.ot ? `${c.basic} + ${c.ot} إضافي` : `${c.basic} ساعات`};
  }
  if(r.n) return {cls: noteIsGood(r.n) ? "ok" : "bad", t: r.n};
  if(dow === 5) return {cls:"off", t:"جمعة"};
  if(hol) return {cls:"off", t:"عيد"};
  if(date > todayStr()) return {cls:"off", t:"لسه"};
  return {cls:"todo", t:"لسه ما اتسجلش"};
}

function readTime(prefix, isTo){
  const hEl = document.getElementById(prefix + "-h"), mEl = document.getElementById(prefix + "-m");
  const hs = hEl.value.trim(), ms = mEl.value.trim();
  if(!hs && !ms) return {empty:true};
  if(!/^\d{1,2}$/.test(hs) || (ms && !/^\d{1,2}$/.test(ms))) return {bad:"اكتب الساعة أرقام بس"};
  const h = +hs, m = ms ? +ms : 0;
  if(m > 59) return {bad:"الدقايق من 0 لـ 59"};
  if(h > 24 || (!isTo && h > 23)) return {bad:"الساعة من 1 لـ 12"};
  return {v: isTo ? normTo(h, m) : normFrom(h, m)};
}

async function saveDayRow(row){
  const wid = row.dataset.wid, date = row.dataset.date, idp = `d-${wid}-${date}`;
  const f = readTime(idp + "-f", false), t = readTime(idp + "-t", true);
  const note = document.getElementById(idp + "-n").value.trim();

  const show = (txt, cls) => { st.textContent = txt; st.className = "stat " + cls; };

  if(f.bad || t.bad){ show(f.bad || t.bad, "bad"); (f.bad ? row.querySelector(".tf .tm") : row.querySelector(".tt .tm")).classList.add("bad"); return; }
  if(f.empty !== t.empty){ show(f.empty ? "ناقص ميعاد الحضور" : "ناقص ميعاد الانصراف", "todo"); return; }
  const rec = {};

  const ym = ymOf(date), dd = date.slice(8), path = `att/${wid}__${ym}`;

async function submitAdd(){

/* ===================== قسم تقفيل الـ time sheet ===================== */
function mgrMonths(){
  const cur = ymOf(todayStr()); let min = cur, max = cur;
  for(const w of Object.values(S.workers)) if(w.addedAt){ const t = wType(w, ymOf(w.addedAt)); let m = ymOf(w.addedAt); if(t === "staff" && +w.addedAt.slice(8) >= 26) m = addMonths(m, 1); if(m < min) min = m; }
  for(const d of Object.values(S.att)) if(d.days && Object.values(d.days).some(Boolean)){ if(d.ym < min) min = d.ym; if(d.ym > max) max = d.ym; }
  for(const o of Object.values(S.ovr)) if(o.ym && o.ym > max) max = o.ym;
  const out = []; let m = min, g = 0; while(m <= max && g++ < 240){ out.push(m); m = addMonths(m, 1); }
  return out.reverse();
}
function cssOf(s){
  const st = TPL.styles[s] || {}; let c = "";
  if(st.bg) c += `background:${st.bg};`;
  c += `color:${st.fc || "#000"};font-size:${st.sz || 11}pt;font-family:'${st.ff || "Calibri"}',Calibri,Carlito,'Segoe UI',sans-serif;`;
  if(st.b) c += "font-weight:700;"; if(st.i) c += "font-style:italic;"; if(st.u) c += "text-decoration:underline;";
  return c;
}
const borderOf = (s, side) => (TPL.styles[s] || {})[side] || "";
let MERGE = null;
function mergeMap(){
  if(MERGE) return MERGE;
  MERGE = {top:{}, covered:{}};
  for(const m of TPL.merges){
    const [a, b] = m.split(":"), [ca, ra] = splitRef(a), [cb, rb] = splitRef(b);
    MERGE.top[a] = {rs: rb - ra + 1, cs: colNum(cb) - colNum(ca) + 1, a, b, tr: cb + ra, bl: ca + rb};
    for(let r = ra; r <= rb; r++) for(let c = colNum(ca); c <= colNum(cb); c++){ const ref = colLet(c) + r; if(ref !== a) MERGE.covered[ref] = a; }
  }
  return MERGE;
}
function gridHtml(sh){
  const M = mergeMap(), cols = TPL.cols, nC = cols.length;
  const isEmpty = ref => { const v = sh.vals[ref]; return (v === null || v === undefined || v === "") && !M.covered[ref] && !M.top[ref]; };
  let h = `<table class="g" id="xlg" style="width:${36 + cols.reduce((a,b)=>a+b,0)}px"><colgroup><col style="width:36px">${cols.map(w => `<col style="width:${w}px">`).join("")}</colgroup>`;
  h += `<thead><tr><th class="corner"></th>${COLS.slice(0, nC).map(L => `<th>${L}</th>`).join("")}</tr></thead><tbody>`;
  for(let r = 1; r <= TPL.nrows; r++){
    const ht = TPL.rows[r] || 20;
    h += `<tr style="height:${ht}px"><th class="rh">${r}</th>`;
    for(let ci = 1; ci <= nC; ci++){
      const L = colLet(ci), ref = L + r;
      if(M.covered[ref]) continue;
      const c = sh.cells[ref] || {s:0}, s = c.s || 0, st = TPL.styles[s] || {}, mg = M.top[ref];
      let span = "", wpx = cols[ci-1], hpx = ht;
      const bt = borderOf(s, "bt"), bl = borderOf(s, "bl");
      let br = borderOf(s, "br"), bb = borderOf(s, "bb");
      if(mg){
        span = ` rowspan="${mg.rs}" colspan="${mg.cs}"`;
        const trs = (sh.cells[mg.tr] || {}).s || 0, bls = (sh.cells[mg.bl] || {}).s || 0;
        br = borderOf(trs, "br") || br; bb = borderOf(bls, "bb") || bb;
        wpx = 0; for(let k = 0; k < mg.cs; k++) wpx += cols[ci-1+k];
        hpx = 0; for(let k = 0; k < mg.rs; k++) hpx += TPL.rows[r+k] || 20;
      }
      let bcss = ""; if(bt) bcss += `border-top:${bt};`; if(br) bcss += `border-right:${br};`; if(bb) bcss += `border-bottom:${bb};`; if(bl) bcss += `border-left:${bl};`;
      const v = sh.vals[ref], txt = fmtVal(v, st.nf);
      const isNum = typeof v === "number", isErr = v instanceof XErr;
      let ha = st.ha || (isNum ? "right" : isErr || typeof v === "boolean" ? "center" : "left");
      const va = st.va === "center" ? "center" : st.va === "top" ? "flex-start" : "flex-end";
      let left = 0, width = wpx;
      if(txt && !isNum && !st.wrap && !mg && (ha === "left" || ha === "general" || ha === "center" || ha === "right")){
        let er = 0, el = 0;
        for(let k = ci + 1; k <= nC && isEmpty(colLet(k) + r); k++) er += cols[k-1];
        for(let k = ci - 1; k >= 1 && isEmpty(colLet(k) + r); k--) el += cols[k-1];
        if(ha === "center"){ const x = Math.min(er, el); left = -x; width = wpx + 2*x; }
        else if(ha === "right"){ left = -el; width = wpx + el; }
        else width = wpx + er;
      }
      const jc = ha === "center" || ha === "centerContinuous" ? "center" : ha === "right" ? "flex-end" : "flex-start";
      const cls = [st.bg ? "fill" : "", sh.ovrRefs.has(ref) ? "ovr" : "", S.mgr.sel === ref ? "sel" : ""].join(" ").trim();
      h += `<td data-ref="${ref}"${span}${cls ? ` class="${cls}"` : ""} style="${st.bg ? `background:${st.bg};` : ""}${bcss}">` +
        (txt ? `<div class="v${st.wrap ? " wrap" : ""}" style="${cssOf(s)}left:${left}px;width:${width}px;justify-content:${jc};align-items:${va};${st.wrap ? `text-align:${jc === "center" ? "center" : jc === "flex-end" ? "right" : "left"};` : ""}${st.wrap ? "" : ""}">${esc(txt)}</div>` : "") + `</td>`;
    }
    h += "</tr>";
  }
  return h + "</tbody></table>";
}
function rawOf(sh, ref){
  if(ref === "C8"){ const r = eff(sh.w, "rate", sh.ym); return r === undefined ? "" : String(r); }
  const o = S.ovr[sh.wid + "__" + sh.ym];
  if(o && o.cells && o.cells[ref] !== null && o.cells[ref] !== undefined) return String(o.cells[ref]);
  const c = sh.cells[ref]; if(!c) return "";
  if(c.f != null) return "=" + c.f;
  if(c.v === undefined || c.v === null) return "";
  if(typeof c.v === "number" && /ddd|yy/.test((TPL.styles[c.s] || {}).nf || "")){ const d = fromSerial(c.v); return `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`; }
  return String(c.v);
}
function curBook(){ const [ym, h] = S.mgr.group.split("|"); return {ym, half:+h, sheets: bookSheets(ym, h === "1" ? "view1" : "view2")}; }
function selectCell(ref, focusGrid){
  S.mgr.sel = ref; render();
  const gw = $("#gw"); if(!gw) return;
  const td = gw.querySelector(`td[data-ref="${ref}"]`);
  if(td){ const r = td.getBoundingClientRect(), g = gw.getBoundingClientRect();
    if(r.right > g.right) gw.scrollLeft += r.right - g.right + 20; if(r.left < g.left + 36) gw.scrollLeft -= g.left + 36 - r.left + 20;
    if(r.bottom > g.bottom) gw.scrollTop += r.bottom - g.bottom + 10; if(r.top < g.top + 20) gw.scrollTop -= g.top + 20 - r.top + 10; }
  if(focusGrid) gw.focus({preventScroll:true});
}
async function commitCell(raw){
  const {ym, sheets} = curBook(); const sh = sheets.find(s => s.wid === S.mgr.sheet); if(!sh) return;
  const ref = S.mgr.sel;
  if(ref === "C8"){
    const n = Number(String(raw).replace(/[^\d.]/g, ""));
    if(raw.trim() !== "" && (isNaN(n) || n <= 0)){ toast("اليومية لازم تكون رقم."); return; }
    await safeWrite(() => DB.doc("workers/" + sh.wid).update({hist: {rate: {[ym]: raw.trim() === "" ? null : n}}}), "اليومية اتحفظت من الشهر ده وطالع");
    return;
  }
  if(ref === "G6"){ await safeWrite(() => DB.doc("workers/" + sh.wid).update({hist: {title: {[ym]: raw.trim() || null}}}), "المسمى الوظيفي اتحفظ من الشهر ده وطالع"); return; }
  if(raw === rawOf(sh, ref)) return;
  if(raw.startsWith("=")){ try{ parseFormula(raw.slice(1)); }catch(e){ toast("المعادلة فيها غلط: " + (e.e || "")); return; } }
  await safeWrite(() => upsert(`ovr/${sh.wid}__${ym}`, {cells: {[ref]: raw}}, {wid: sh.wid, ym}));
}
async function resetCell(){
  const {ym} = curBook(); const wid = S.mgr.sheet, ref = S.mgr.sel;
  await safeWrite(() => upsert(`ovr/${wid}__${ym}`, {cells: {[ref]: null}}, {wid, ym}), "رجعت للقيمة الأوتوماتيك");
}
function moveSel(dr, dc){
  const M = mergeMap(); let [c, r] = splitRef(S.mgr.sel); let ci = colNum(c);
  const mg = M.top[S.mgr.sel];
  if(mg){ if(dc > 0) ci += mg.cs - 1; if(dr > 0) r += mg.rs - 1; }
  r = Math.min(TPL.nrows, Math.max(1, r + dr)); ci = Math.min(TPL.cols.length, Math.max(1, ci + dc));
  let ref = colLet(ci) + r; if(M.covered[ref]) ref = M.covered[ref];
  selectCell(ref, true);
}

/* ===================== الأحداث ===================== */
view().addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if(!t) return;
  const a = t.dataset.act;
  if(a === "quick"){ const row = t.closest(".rr"); if(row) quickFill(row, t.dataset.kind); }
  else if(a === "add"){ S.adding = true; render(); window.scrollTo(0, 0); }
  else if(a === "add-cancel"){ goBack(); }
  else if(a === "nkind"){ const p = t.closest(".npick"); p.dataset.kind = t.dataset.k; p.innerHTML = pickerInner(t.dataset.k); }
  else if(a === "nopt"){ applyNote(t.closest(".npick"), t.dataset.v); }
  else if(a === "day-prev" || a === "day-next"){ S.day = ymd(addDays(parseYMD(S.day || todayStr()), a === "day-prev" ? -1 : 1)); render(); }
  else if(a === "day-today"){ S.day = todayStr(); render(); }
  else if(a === "half-prev" || a === "half-next"){ const [ym, h] = (S.people.half || halfKeyOf(todayStr())).split("|"); S.people.half = `${addMonths(ym, a === "half-prev" ? -1 : 1)}|${h}`; render(); }
  else if(a === "half-set"){ S.people.half = t.dataset.k; render(); }
  else if(a === "open-person"){ S.people.wid = t.dataset.wid; S.people.confirm = false; render(); window.scrollTo(0, 0); }
  else if(a === "remove"){ S.people.confirm = true; render(); }
  else if(a === "remove-no"){ S.people.confirm = false; render(); }
  else if(a === "remove-yes"){ const wid = t.dataset.wid; S.people.confirm = false; await safeWrite(() => DB.doc("workers/" + wid).update({removedAt: todayStr()}), "اتشال من الشغل"); }
  else if(a === "restore"){ await safeWrite(() => DB.doc("workers/" + t.dataset.wid).update({removedAt: null}), "رجع تاني"); }
  else if(a === "open-book"){ S.mgr.group = t.dataset.k; S.mgr.sheet = null; S.mgr.sel = "A1"; render(); window.scrollTo(0, 0); }
  else if(a === "tab"){ S.mgr.sheet = t.dataset.wid; render(); }
  else if(a === "dl"){ t.disabled = true; try{ await download(curBook().ym, t.dataset.kind); } finally { t.disabled = false; } }
  else if(a === "goto"){ S.mgr.sheet = t.dataset.wid; selectCell(t.dataset.ref, true); const gw = $("#gw"); if(gw) gw.scrollIntoView({block:"nearest"}); }
  else if(a === "cell-reset"){ await resetCell(); }
  else if(a === "set-rate"){
    const row = t.closest(".arow"), wid = t.dataset.wid, ym = curBook().ym;
    const rate = Number(row.querySelector(".a-rate").value), type = row.querySelector(".a-type").value, title = row.querySelector(".a-title").value.trim();
    if(!(rate > 0)){ toast("اكتب اليومية بالجنيه."); row.querySelector(".a-rate").focus(); return; }
    const w = S.workers[wid], hist = {rate: {[ym]: rate}, type: {[ym]: type}};
    if(title && title !== (JOB_EN[w.job] || "")) hist.title = {[ym]: title};
    await safeWrite(() => DB.doc("workers/" + wid).update({hist}), `اتحفظت يومية ${w.name}`);
  }
  else if(a === "hol-add"){ const d = $("#holNew").value; if(!d){ toast("اختار التاريخ الأول."); return; } await safeWrite(() => upsert("cfg/main", {holidays: {[d]: true}}, {}), "اليوم اتسجل عيد"); }
  else if(a === "hol-del"){ const d = t.dataset.d; await safeWrite(() => upsert("cfg/main", {holidays: {[d]: null}}, {}), "اتشال من الأعياد"); }
});
view().addEventListener("focusin", e => { if(e.target.classList && e.target.classList.contains("note")) openPicker(e.target); });
view().addEventListener("click", e => { if(e.target.classList && e.target.classList.contains("note")) openPicker(e.target); });
view().addEventListener("focusout", e => {
  if(!(e.target.classList && e.target.classList.contains("note"))) return;
  setTimeout(() => { const a = document.activeElement; if(!(a && a.classList && a.classList.contains("note"))) closePicker(); }, 150);
});
view().addEventListener("mousedown", e => { if(e.target.closest(".npick")) e.preventDefault(); });
view().addEventListener("mousedown", e => {
  const td = e.target.closest("table.g td[data-ref]"); if(!td) return;
  e.preventDefault(); selectCell(td.dataset.ref, true);
});
view().addEventListener("dblclick", e => {
  const td = e.target.closest("table.g td[data-ref]"); if(!td) return;
  const fi = $("#fIn"); if(fi){ fi.focus(); fi.setSelectionRange(fi.value.length, fi.value.length); }
});
view().addEventListener("submit", e => { if(e.target.id === "addForm"){ e.preventDefault(); submitAdd(); } });
view().addEventListener("input", e => {
  const el = e.target;
  if(el.id === "q"){ S.q = el.value; const pos = el.selectionStart; render(); const s = $("#q"); if(s){ s.focus(); s.setSelectionRange(pos, pos); } return; }
  if(el.classList.contains("hh") || el.classList.contains("mm")) el.value = el.value.replace(/[^\d]/g, "").slice(0, 2);
  // الساعة لما تتكتب رقمين (أو رقم أكبر من 2) نروح للدقايق على طول
  if(el.classList.contains("hh") && (/^\d{2}$/.test(el.value) || /^[3-9]$/.test(el.value)) && document.activeElement === el){
    const m = el.parentElement.querySelector(".mm"); if(m){ padHourInput(el); m.focus(); m.select(); }
  }
});
view().addEventListener("change", e => {
  const el = e.target;
  if(el.id === "dayPick"){ if(el.value){ S.day = el.value; render(); } return; }
  if(el.id === "wsType"){ const ym = curBook().ym; safeWrite(() => DB.doc("workers/" + el.dataset.wid).update({hist: {type: {[ym]: el.value}}}), "نوع العامل اتغير من الشهر ده"); return; }
  const row = el.closest(".rr");
  if(row){ if(el.classList.contains("hh")) padHourInput(el); if(el.classList.contains("mm") && /^\d$/.test(el.value.trim())) el.value = "0" + el.value.trim(); saveDayRow(row); }
});
view().addEventListener("focusout", e => {
  const el = e.target;
  if(el.classList && el.classList.contains("hh")) padHourInput(el);
  if(el.classList && el.classList.contains("mm") && /^\d$/.test(el.value.trim())) el.value = "0" + el.value.trim();
});
view().addEventListener("keydown", e => {
  const el = e.target;
  if(el.closest && el.closest(".rr") && e.key === "Enter"){ e.preventDefault(); el.blur(); return; }
  if(el.id === "fIn"){
    if(e.key === "Enter"){ e.preventDefault(); const v = el.value; S.mgr.editing = false; $("#gw").focus({preventScroll:true}); commitCell(v).then(() => moveSel(1, 0)); }
    else if(e.key === "Escape"){ e.preventDefault(); render(); $("#gw") && $("#gw").focus({preventScroll:true}); }
    else if(e.key === "Tab"){ e.preventDefault(); const v = el.value; $("#gw").focus({preventScroll:true}); commitCell(v).then(() => moveSel(0, e.shiftKey ? -1 : 1)); }
    return;
  }
  if(el.id === "fRef" && e.key === "Enter"){ e.preventDefault(); const r = el.value.trim().toUpperCase(); if(/^[A-U]([1-9]|[1-3]\d|40)$/.test(r)){ const M = mergeMap(); selectCell(M.covered[r] || r, true); } else toast("اكتب خانة زي B10"); return; }
  if(el.id === "gw"){
    const k = e.key;
    if(k === "ArrowDown"){ e.preventDefault(); moveSel(1, 0); }
    else if(k === "ArrowUp"){ e.preventDefault(); moveSel(-1, 0); }
    else if(k === "ArrowRight"){ e.preventDefault(); moveSel(0, 1); }
    else if(k === "ArrowLeft"){ e.preventDefault(); moveSel(0, -1); }
    else if(k === "Enter"){ e.preventDefault(); moveSel(1, 0); }
    else if(k === "Tab"){ e.preventDefault(); moveSel(0, e.shiftKey ? -1 : 1); }
    else if(k === "F2"){ e.preventDefault(); const fi = $("#fIn"); fi.focus(); fi.setSelectionRange(fi.value.length, fi.value.length); }
    else if(k === "Delete" || k === "Backspace"){ e.preventDefault(); commitCell(""); }
    else if(k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); const fi = $("#fIn"); fi.value = k; fi.focus(); }
  }
});

/* ===================== التشغيل ===================== */
(async function boot(){
  try{ const l = +sessionStorage.getItem("me_lvl"); if(l === 1 || l === 2){ S.tab = l === 2 ? "close" : "day"; S.level = l; } }catch(e){}
  if(window.ME_API){
    DB = makeGasDB(apiCall(window.ME_API)); DL = anchorDownloads;
  } else if(window.google && google.script && google.script.run){
    DB = makeGasDB(); DL = anchorDownloads;
  } else if(window.claude && typeof window.claude.use === "function"){
    const [db, dl] = await Promise.all([window.claude.use("db").catch(() => null), window.claude.use("downloads").catch(() => null)]);
    DB = db; DL = dl;
    if(!DB){ showBanner("bad", "التسجيل مش هيتحفظ: لازم تكون عامل تسجيل دخول والصفحة متشاركة معاك."); S.readOnly = true; DB = makeMemDB(); MEM = true; }
  } else { DB = makeMemDB(); MEM = true; DL = anchorDownloads; showBanner("warn", "وضع تجربة: البيانات مش بتتحفظ."); }
  subscribe();
  render();
  /* زرار التثبيت (لو التطبيق مش متثبت) */
  if(window.ME_API){
    const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    let deferred = null;
    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; $("#installBtn").hidden = false; });
    $("#installBtn").addEventListener("click", async () => { if(!deferred) return; deferred.prompt(); try{ await deferred.userChoice; }catch(e){} deferred = null; $("#installBtn").hidden = true; });
    window.addEventListener("appinstalled", () => { $("#installBtn").hidden = true; toast("التطبيق اتثبت"); });
    if(!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)) $("#iosHint").hidden = false;
  }
  /* التطبيق (PWA): service worker + تحديث أوتوماتيك لما ننشر نسخة جديدة */
  if(window.ME_API && "serviceWorker" in navigator){
    let had = !!navigator.serviceWorker.controller, reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if(!had){ had = true; return; }
      if(reloading) return;
      const go = () => { if(!reloading){ reloading = true; location.reload(); } };
      if(isEditing()) document.addEventListener("focusout", () => setTimeout(() => { if(!isEditing()) go(); }, 400)); else go();
    });
    navigator.serviceWorker.register("sw.js").then(reg => {
      document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") reg.update().catch(() => {}); });
    }).catch(() => {});
  }
  if(MEM && (location.hostname === "localhost" || location.hostname === "127.0.0.1")){
    window.__dev = {S, DB, buildSheet, bookSheets, buildXlsx, calcDay, evalSheet, fmtVal, render, setLevel};
    S.readOnly = false;
  }
})();
</script>
